# CI is DISABLED by default: this workflow runs only when started manually
# (GitHub -> Actions -> CI -> "Run workflow"), so cloning or forking the repo
# never triggers automatic runs.
#
# To enable automatic CI on every push / pull request, uncomment the
# `push:` and `pull_request:` lines in the `on:` block below.
name: CI

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARBITERFORGE_TEST_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci_test
      ARBITERFORGE_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run pytest

name: ${COMPOSE_PROJECT_NAME:-arbiterforge}

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: runtime
  env_file: .env
  environment:
    ARBITERFORGE_ENV: ${ARBITERFORGE_ENV:-dev}
    ARBITERFORGE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-arbiterforge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arbiterforge}
    ARBITERFORGE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ARBITERFORGE_TOKEN_SECRET: ${ARBITERFORGE_TOKEN_SECRET}
    ARBITERFORGE_AUDIT_HMAC_SECRET: ${ARBITERFORGE_AUDIT_HMAC_SECRET}
    ARBITERFORGE_OLLAMA_BASE_URL: ${ARBITERFORGE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ARBITERFORGE_CORS_ALLOW_ORIGINS: ${ARBITERFORGE_CORS_ALLOW_ORIGINS:-http://127.0.0.1:20100}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true

  api:
    <<: *app
    ports:
      - "127.0.0.1:${API_HOST_PORT:-20100}:8023"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8023/api/v1/health/live').status==200 else 1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  worker:
    <<: *app
    command:
      [
        "celery",
        "-A",
        "arbiterforge.infrastructure.celery_app.celery_app:celery_app",
        "worker",
        "--beat",
        "-Q",
        "celery,relay,projection,reminders,ai_draft",
        "--concurrency=2",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arbiterforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-arbiterforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arbiterforge} -d ${POSTGRES_DB:-arbiterforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    env_file: .env
    environment:
      ARBITERFORGE_ENV: test
      ARBITERFORGE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-arbiterforge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arbiterforge}
      ARBITERFORGE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ARBITERFORGE_TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-arbiterforge}:${POSTGRES_PASSWORD}@postgres:5432/arbiterforge_test
      ARBITERFORGE_TEST_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      ARBITERFORGE_TOKEN_SECRET: ${ARBITERFORGE_TOKEN_SECRET}
      ARBITERFORGE_AUDIT_HMAC_SECRET: ${ARBITERFORGE_AUDIT_HMAC_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["pytest", "-q"]

volumes:
  pgdata:
